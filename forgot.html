<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pdlvwpsgqnqwrmymqksn.supabase.co";
const SUPABASE_ANON = "sb_publishable_IEYtgxxMFdaxn5gshxE1Dw_E7EZCdfa";
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const supabase = _supabase;

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    document.getElementById("nav-login").style.display = "none";
    document.getElementById("nav-account").style.display = "block";
  }
  return session;
}

async function signOut() {
  await supabase.auth.signOut();
  window.location.href = "index.html";
}

checkAuth();
</script>
<script>
async function resetPassword() {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("msg");
  if (!email) { msg.textContent = "Please enter your email"; msg.style.color="#ff4444"; msg.style.display="block"; return; }
  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/reset.html"
  });
  if (error) { msg.textContent = error.message; msg.style.color="#ff4444"; }
  else { msg.textContent = "Reset link sent! Check your inbox."; msg.style.color="#4CAF50"; }
  msg.style.display = "block";
}
</script>
