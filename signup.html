<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account | INDIA DRONE FOOTAGE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Segoe UI",sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;}
.container{max-width:440px;margin:60px auto;padding:0 20px;}
.card{background:#1a1a1a;border-radius:12px;padding:35px;border:1px solid #333;}
.card h2{color:#ff6b00;font-size:1.5em;margin-bottom:8px;text-align:center;}
.card p{color:#aaa;font-size:0.9em;text-align:center;margin-bottom:25px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;margin-bottom:7px;font-size:0.88em;color:#aaa;}
.form-group input{width:100%;padding:12px 16px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-size:1em;outline:none;}
.form-group input:focus{border-color:#ff6b00;}
.btn{width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:1em;font-weight:bold;cursor:pointer;margin-top:5px;}
.btn:hover{background:#e55900;}
.btn-google{width:100%;padding:14px;background:#fff;color:#333;border:none;border-radius:8px;font-size:1em;font-weight:bold;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{background:#f5f5f5;}
.divider{text-align:center;color:#555;margin:20px 0;font-size:0.85em;position:relative;}
.divider::before,.divider::after{content:"";position:absolute;top:50%;width:42%;height:1px;background:#333;}
.divider::before{left:0;} .divider::after{right:0;}
.link{text-align:center;margin-top:20px;font-size:0.88em;color:#aaa;}
.link a{color:#ff6b00;text-decoration:none;}
.error{color:#ff4444;font-size:0.85em;margin-top:10px;display:none;text-align:center;}
.success{color:#4CAF50;font-size:0.85em;margin-top:10px;display:none;text-align:center;}
.purchase-banner{background:#1a0a00;border:1px solid #ff6b00;border-radius:8px;padding:12px 15px;margin-bottom:20px;font-size:0.85em;color:#ff6b00;text-align:center;}
</style>
</head>
<body>
<header style="background:#0a0a0a;padding:0;border-bottom:2px solid #ff6b00;position:sticky;top:0;z-index:1000;">
<div style="max-width:1200px;margin:0 auto;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0;">
<a href="index.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;">Home</a>
<a href="about.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;">About</a>
<a href="license.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;">License</a>
<a href="faq.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;">FAQ</a>
<a href="terms.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;">Terms</a>
<a href="mailto:hello@indiadronefootage.com" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;">Contact</a>
<a href="account.html" style="color:#ff6b00;text-decoration:none;padding:16px 18px;font-size:0.88em;font-weight:bold;">My Account</a>
</div>
</header>

<div class="container">
<div class="card">
<div class="purchase-banner" id="purchase-banner" style="display:none;">
  Create an account to complete your purchase
</div>
<h2>Create Account</h2>
<p>Sign up to purchase and download footage instantly</p>

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" placeholder="Your name">
</div>
<div class="form-group">
<label>Email Address *</label>
<input type="email" id="email" placeholder="you@example.com">
</div>
<div class="form-group">
<label>Password *</label>
<input type="password" id="password" placeholder="Min 6 characters">
</div>

<button class="btn" onclick="signUp()">Create Account</button>

<div class="divider">or</div>

<button class="btn-google" onclick="signInGoogle()">
<img src="https://www.google.com/favicon.ico" width="18"> Continue with Google
</button>

<div class="error" id="error"></div>
<div class="success" id="success"></div>
<div class="link">Already have an account? <a href="login.html">Sign In</a></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb = window.supabase.createClient("https://pdlvwpsgqnqwrmymqksn.supabase.co", "sb_publishable_IEYtgxxMFdaxn5gshxE1Dw_E7EZCdfa");

function getRedirectUrl() {
  try {
    var stored = sessionStorage.getItem("pending_purchase");
    if (stored) {
      var p = JSON.parse(stored);
      if (p.clip && p.rzp) {
        return "buy.html?" +
          "clip=" + encodeURIComponent(p.clip) +
          "&city=" + encodeURIComponent(p.city) +
          "&license=" + encodeURIComponent(p.license) +
          "&drive=" + encodeURIComponent(p.drive) +
          "&amount=" + p.amount +
          "&rzp=" + encodeURIComponent(p.rzp);
      }
    }
  } catch(e) {}
  return "account.html";
}

function init() {
  try {
    var stored = sessionStorage.getItem("pending_purchase");
    if (stored) {
      document.getElementById("purchase-banner").style.display = "block";
    }
  } catch(e) {}

  sb.auth.onAuthStateChange(function(event, session) {
    if (event === "SIGNED_IN" && session) {
      window.location.href = getRedirectUrl();
    }
  });

  sb.auth.getSession().then(function(result) {
    if (result.data.session) {
      window.location.href = getRedirectUrl();
    }
  });
}

async function signUp() {
  var name = document.getElementById("name").value.trim();
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  var errorEl = document.getElementById("error");
  var successEl = document.getElementById("success");

  if (!email || !password) {
    errorEl.textContent = "Email and password are required";
    errorEl.style.display = "block";
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = "Password must be at least 6 characters";
    errorEl.style.display = "block";
    return;
  }

  var result = await sb.auth.signUp({
    email: email,
    password: password,
    options: {data: {full_name: name}}
  });

  if (result.error) {
    errorEl.textContent = result.error.message;
    errorEl.style.display = "block";
    successEl.style.display = "none";
  } else if (result.data.session) {
    window.location.href = getRedirectUrl();
  } else {
    successEl.textContent = "Account created! Signing you in...";
    successEl.style.display = "block";
    var signInResult = await sb.auth.signInWithPassword({email: email, password: password});
    if (signInResult.data.session) {
      window.location.href = getRedirectUrl();
    }
  }
}

async function signInGoogle() {
  var redirectTo = "https://indiadronefootage.com/" + getRedirectUrl();
  await sb.auth.signInWithOAuth({
    provider: "google",
    options: {redirectTo: redirectTo}
  });
}

init();
</script>
</body>
</html>
