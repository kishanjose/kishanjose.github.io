<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign Up | INDIA DRONE FOOTAGE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Segoe UI",sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;}
.container{max-width:440px;margin:60px auto;padding:0 20px;}
.card{background:#1a1a1a;border-radius:12px;padding:35px;border:1px solid #333;}
.card h2{color:#ff6b00;font-size:1.5em;margin-bottom:8px;text-align:center;}
.card p{color:#aaa;font-size:0.9em;text-align:center;margin-bottom:25px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;margin-bottom:7px;font-size:0.88em;color:#aaa;}
.form-group input{width:100%;padding:12px 16px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-size:1em;outline:none;}
.form-group input:focus{border-color:#ff6b00;}
.btn{width:100%;padding:14px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:1em;font-weight:bold;cursor:pointer;margin-top:5px;}
.btn:hover{background:#e55900;}
.btn-google{width:100%;padding:14px;background:#fff;color:#333;border:none;border-radius:8px;font-size:1em;font-weight:bold;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{background:#f5f5f5;}
.divider{text-align:center;color:#555;margin:20px 0;font-size:0.85em;position:relative;}
.divider::before,.divider::after{content:"";position:absolute;top:50%;width:42%;height:1px;background:#333;}
.divider::before{left:0;} .divider::after{right:0;}
.link{text-align:center;margin-top:20px;font-size:0.88em;color:#aaa;}
.link a{color:#ff6b00;text-decoration:none;}
.error{color:#ff4444;font-size:0.85em;margin-top:10px;display:none;text-align:center;}
.success{color:#4CAF50;font-size:0.85em;margin-top:10px;display:none;text-align:center;}
</style>
</head>
<body>
<header style="background:#0a0a0a;padding:0;border-bottom:2px solid #ff6b00;position:sticky;top:0;z-index:1000;">
<div style="max-width:1200px;margin:0 auto;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0;">
<a href="index.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;border-bottom:2px solid transparent;" onmouseover="this.style.color='#ff6b00';this.style.borderBottomColor='#ff6b00'" onmouseout="this.style.color='#ccc';this.style.borderBottomColor='transparent'">Home</a>
<a href="about.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;border-bottom:2px solid transparent;" onmouseover="this.style.color='#ff6b00';this.style.borderBottomColor='#ff6b00'" onmouseout="this.style.color='#ccc';this.style.borderBottomColor='transparent'">About</a>
<a href="license.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;border-bottom:2px solid transparent;" onmouseover="this.style.color='#ff6b00';this.style.borderBottomColor='#ff6b00'" onmouseout="this.style.color='#ccc';this.style.borderBottomColor='transparent'">License</a>
<a href="faq.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;border-bottom:2px solid transparent;" onmouseover="this.style.color='#ff6b00';this.style.borderBottomColor='#ff6b00'" onmouseout="this.style.color='#ccc';this.style.borderBottomColor='transparent'">FAQ</a>
<a href="terms.html" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;border-bottom:2px solid transparent;" onmouseover="this.style.color='#ff6b00';this.style.borderBottomColor='#ff6b00'" onmouseout="this.style.color='#ccc';this.style.borderBottomColor='transparent'">Terms</a>
<a href="mailto:hello@indiadronefootage.com" style="color:#ccc;text-decoration:none;padding:16px 18px;font-size:0.88em;border-bottom:2px solid transparent;" onmouseover="this.style.color='#ff6b00';this.style.borderBottomColor='#ff6b00'" onmouseout="this.style.color='#ccc';this.style.borderBottomColor='transparent'">Contact</a>
<a href="account.html" id="nav-account" style="color:#ff6b00;text-decoration:none;padding:16px 18px;font-size:0.88em;font-weight:bold;border-bottom:2px solid transparent;display:none;">My Account</a>
<a href="login.html" id="nav-login" style="color:#ff6b00;text-decoration:none;padding:16px 18px;font-size:0.88em;font-weight:bold;border-bottom:2px solid transparent;">Sign In</a>
</div>
</header>
<div class="container">
<div class="card">
<h2>Create Account</h2>
<p>Sign up to purchase and download footage instantly</p>

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" placeholder="Your name">
</div>
<div class="form-group">
<label>Email Address *</label>
<input type="email" id="email" placeholder="you@example.com">
</div>
<div class="form-group">
<label>Password *</label>
<input type="password" id="password" placeholder="Min 6 characters">
</div>

<button class="btn" onclick="signUp()">Create Account</button>

<div class="divider">or</div>

<button class="btn-google" onclick="signInGoogle()">
<img src="https://www.google.com/favicon.ico" width="18"> Continue with Google
</button>

<div class="error" id="error"></div>
<div class="success" id="success"></div>

<div class="link">Already have an account? <a href="login.html">Sign In</a></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pdlvwpsgqnqwrmymqksn.supabase.co";
const SUPABASE_ANON = "sb_publishable_IEYtgxxMFdaxn5gshxE1Dw_E7EZCdfa";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    document.getElementById("nav-login").style.display = "none";
    document.getElementById("nav-account").style.display = "block";
  }
  return session;
}

async function signOut() {
  await supabase.auth.signOut();
  window.location.href = "index.html";
}

checkAuth();
</script>
<script>
async function signUp() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("error");
  const successEl = document.getElementById("success");

  if (!email || !password) {
    errorEl.textContent = "Email and password are required";
    errorEl.style.display = "block";
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = "Password must be at least 6 characters";
    errorEl.style.display = "block";
    return;
  }

  const { data, error } = await supabase.auth.signUp({
    email, password,
    options: { data: { full_name: name } }
  });

  if (error) {
    errorEl.textContent = error.message;
    errorEl.style.display = "block";
    successEl.style.display = "none";
  } else {
    successEl.textContent = "Account created! Check your email to confirm, then sign in.";
    successEl.style.display = "block";
    errorEl.style.display = "none";
    setTimeout(() => window.location.href = "login.html", 3000);
  }
}

async function signInGoogle() {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin + "/account.html" }
  });
}
</script>
</body>
</html>
